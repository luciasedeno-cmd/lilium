<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo · Lilium · Escape Room ESADA</title>
<meta name="description" content="Reserva tu turno en Lilium, el escape room de la fiesta de ESADA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:ital,wght@0,400;0,600;1,400&family=Luxurious+Script&display=swap" rel="stylesheet">
<style>
/* =========================================================
   VERSIÓN FINAL · diseño de Figma «Lilium-Figma / Diseño Web».
   Mismas clases y funcionalidad que wireframe.html.
   ========================================================= */
:root{
  /* Colores (estilos de Figma) */
  --verde:#292F20;        /* Verde Oscuro */
  --fondo:#FFFAF2;        /* Fondo */
  --fondo-oscuro:#FFF5E6; /* Fondo oscuro */
  --crudo:#9E9B83;        /* Crudo */
  --rosa:#F792BF;         /* Rosa */
  --terracota:#732F23;    /* Terracota */
  --naranja:#D15E23;      /* Naranja */
  --melocoton:#F4B076;    /* Botón de reserva */
  --gris:#4C4B44;
  /* Tipografías */
  --f-script:"Luxurious Script",cursive;
  --f-serif:"Baskervville","Baskerville",Georgia,serif;
  --f-old:"Baskerville Old Face","Baskervville","Baskerville",Georgia,serif;
  --f-sans:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  /* Sombras */
  --sombra:0 6px 13px rgba(115,47,35,.08),0 23px 23px rgba(115,47,35,.07),0 53px 32px rgba(115,47,35,.04),0 94px 37px rgba(115,47,35,.01);
  --sombra-sala:0 4px 4px rgba(0,0,0,.25);
  --nav-h:100px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--fondo);color:var(--terracota);font:16px/1.35 var(--f-sans);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3{font-weight:400;line-height:1.1;margin:0 0 .4em}
p{margin:0 0 1em}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:2px solid var(--naranja);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--verde);color:var(--fondo);padding:10px 14px;z-index:200;border-radius:7px}.skip:focus{top:8px}

/* Tipos de texto del diseño */
.script{font-family:var(--f-script);font-weight:400;line-height:1.2}
.eyebrow{font:700 26px/1.15 var(--f-serif);text-transform:uppercase;margin:0 0 .1em;color:var(--terracota)}
.muted{opacity:.8} .small{font-size:14px} .center{text-align:center}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap-row{flex-wrap:wrap}
hr.sep{border:0;border-top:1px dashed var(--terracota);margin:14px 0}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 27px;border:1px solid var(--terracota);background:transparent;color:var(--terracota);font:400 24px/1 var(--f-old);text-decoration:none;border-radius:10px;transition:background .15s,color .15s,filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-primary,.btn-rust{background:var(--terracota);color:var(--fondo);border-color:var(--terracota)}
.btn-dark{background:var(--verde);color:var(--fondo-oscuro);border-color:var(--verde)}
.btn-ghost,.btn-light{background:transparent}
.btn-danger{background:transparent;border-style:dashed}
.btn-sm{min-height:41px;padding:6px 18px;font-size:20px}
.btn-block{width:100%}
.btn-big{min-height:60px;font:700 26px/1.1 var(--f-serif);color:#F5F5F5}
.btn-reserva{background:var(--melocoton);color:var(--verde);border:0;border-radius:7px;padding:12px 27px;min-height:48px;font:400 24px/1 var(--f-old);text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.btn-reserva:hover{background:#f7c08f}
.link-btn{background:none;border:0;padding:0;text-decoration:underline;font-weight:600;color:inherit}
.icon-btn{width:40px;height:40px;border:1px solid var(--terracota);background:transparent;display:inline-grid;place-items:center;border-radius:4px;flex:none;color:var(--terracota)}
.icon-btn:hover{background:var(--terracota);color:var(--fondo)}
.icon{width:16px;height:16px;flex:none}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--terracota);background:var(--fondo);color:var(--terracota);font:400 16px/1.2 var(--f-sans);border-radius:4px;white-space:nowrap}
.chip-completo{text-decoration:line-through;opacity:.7}
.chip-lider{background:var(--terracota);color:var(--fondo)}
.chip-ok{background:var(--verde);border-color:var(--verde);color:var(--fondo)}
.chip-medio{border-style:dashed}

/* Avatares */
.stack{display:flex;align-items:center}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 11px/1 var(--f-sans);background:var(--melocoton);color:var(--verde);border:2px solid var(--fondo-oscuro);margin-left:-8px;flex:none}
.stack .av:first-child{margin-left:0}
.av.lg{width:51px;height:51px;font-size:16px;margin-left:-14px}
.av.xl{width:94px;height:94px;font-size:28px;margin-left:-20px}
.av.empty{background:transparent;border:1px dashed var(--terracota);color:var(--terracota)}
.av.c0{background:#F4B076;color:#292F20}.av.c1{background:#F792BF;color:#292F20}.av.c2{background:#9E9B83;color:#292F20}
.av.c3{background:#D15E23;color:#FFFAF2}.av.c4{background:#732F23;color:#FFFAF2}.av.c5{background:#292F20;color:#FFFAF2}

/* Layout */
.wrap{width:100%;max-width:1440px;margin:0 auto;padding:0 16px}
.narrow{max-width:876px}           /* 844 + gutters */
.narrow-782{max-width:814px}       /* 782 + gutters */
.card{background:var(--fondo-oscuro);border-radius:15px;padding:25px;box-shadow:var(--sombra)}
.card + .card{margin-top:40px}
.card h3{font:600 26px/1.2 var(--f-sans);margin:0 0 18px}
.stack-gap > * + *{margin-top:12px}

/* Cabecera de páginas internas (Navegación) */
.mini-head{height:90px;margin:10px 0 0}
.mini-head .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 max(16px,calc((100% - 1220px)/2))}
.logo{display:inline-flex;align-items:center;text-decoration:none;color:var(--verde)}
.logo img{width:198px;height:86px;object-fit:contain}
.lang{display:inline-flex}
.lang button{width:51px;height:41px;border:1px solid var(--verde);background:transparent;color:var(--verde);font:400 16px/1 var(--f-sans);padding:0}
.lang button + button{border-left:0}
.lang button[aria-pressed="true"]{background:var(--verde);color:var(--fondo)}

/* Navbar Home (Header de Figma) */
.nav-desk{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:50;background:var(--fondo)}
.nav-desk .wrap{height:100%;display:flex;align-items:center;gap:24px;padding:0 max(16px,calc((100% - 1380px)/2))}
.nav-desk ul{display:flex;gap:64px;list-style:none;margin:0 0 0 auto;padding:0;align-items:center}
.nav-desk ul button{background:none;border:0;padding:6px 0;font:400 24px/1 var(--f-old);color:var(--verde)}
.nav-desk ul button:hover{text-decoration:underline;text-underline-offset:6px}
.nav-desk .btn-reserva{margin-left:40px}
.page-home{padding-top:0}
@media (max-width:1180px){.nav-desk ul{gap:28px}.nav-desk .btn-reserva{margin-left:8px}}
@media (max-width:959px){
  :root{--nav-h:72px}
  .nav-desk ul{display:none}
  .nav-desk .logo img{width:140px;height:61px}
  .nav-desk .btn-reserva{margin-left:auto;font-size:18px;padding:10px 16px;min-height:40px}
  .nav-desk .lang button{width:40px;height:36px;font-size:14px}
}

/* Progreso (Back button + Step Bar) */
.progress{width:100%;max-width:584px;margin:85px auto 85px}
.progress .row{position:relative;justify-content:center;min-height:51px;margin-bottom:25px}
.progress .icon-btn{position:absolute;left:0;top:0;width:51px;height:51px;border-radius:2px}
.progress .icon-btn .icon{width:22px;height:22px;stroke-width:1.4}
.progress-label{font:700 26px/1 var(--f-serif);color:#000}
.bar{height:13px;border:1px solid rgba(209,94,35,.75);border-radius:20px;overflow:hidden;background:transparent}
.bar > span{display:block;height:100%;background:var(--naranja);border-radius:20px}

/* Formularios */
label.lbl{display:block;font:700 26px/1.15 var(--f-serif);margin:0 0 20px;color:var(--terracota)}
.field{width:100%;min-height:44px;border:1px solid var(--terracota);background:transparent;padding:0 16px;font:400 20px/1 var(--f-sans);color:var(--terracota);border-radius:42px}
.field::placeholder{color:var(--terracota);opacity:1}
.field:focus{outline:none;box-shadow:0 0 0 3px rgba(209,94,35,.35)}
.field[aria-invalid="true"]{border:2px solid var(--naranja)}
.field.valid{border-width:2px}
.hint{display:flex;gap:6px;align-items:flex-start;font:400 16px/1.3 var(--f-sans);margin-top:20px;min-height:1.3em;color:var(--gris)}
.hint .icon{margin-top:2px}
.hint.err{color:var(--naranja);font-weight:600}
.hint.ok{color:var(--verde)}
.code-row{display:flex;gap:8px;justify-content:space-between}
.code-box{width:100%;max-width:64px;height:64px;text-align:center;font:400 28px/1 var(--f-sans);color:var(--terracota);border:1px solid var(--terracota);border-radius:12px;background:transparent}
.code-box[aria-invalid="true"]{border:2px solid var(--naranja)}
.notice{border:1px dashed var(--terracota);padding:10px 14px;display:flex;gap:12px;align-items:flex-start;font:400 16px/1.35 var(--f-sans);color:var(--terracota);background:transparent}
.notice b{font:700 20px/1 var(--f-serif)}
.notice .icon{width:24px;height:24px;margin-top:0}
.notice-demo b{font:600 26px/1 var(--f-sans);letter-spacing:.2em}
.notice-err,.notice-warn{border-style:solid}
.notice-ok{background:var(--fondo-oscuro);border-style:solid}

/* Verificar (PAG VERIFICACIÓN CORREO) */
.page-verify{min-height:100vh}
.verify-main{display:grid;place-items:center;padding:115px 16px 80px}
.verify-card{width:100%;max-width:698px}
.verify-card .card{padding:33px 29px;box-shadow:0 4px 2px rgba(0,0,0,.25)}
.verify-card .eyebrow{margin-bottom:20px}
.verify-card h1{font-size:82px;margin:0 0 20px;white-space:nowrap}
.verify-card .lead{font:400 24px/1.05 var(--f-old);max-width:597px;margin:0 0 20px}
.verify-card .field{height:44px}
.verify-card .btn{height:50px;margin-top:20px}
@media (max-width:720px){.verify-card h1{font-size:54px;white-space:normal}.verify-main{padding-top:48px}}

/* ============ HOME ============ */
.w1440{max-width:1440px;margin:0 auto;position:relative}
.sec{scroll-margin-top:var(--nav-h)}
.encaje{position:absolute;left:0;right:0;height:176px;background-repeat:repeat-x;background-position:center top;background-size:1440px 176px;pointer-events:none;z-index:2}
.encaje-sobre{top:-51px;background-image:url(assets/prototipo/encaje-crema-abajo.png)}
.encaje-bajo{bottom:-33px;background-image:url(assets/prototipo/encaje-crema-arriba.png)}
.encaje-crudo{top:-33px;background-image:url(assets/prototipo/encaje-crudo-abajo.png)}

/* Hero */
.hero{position:relative;height:clamp(600px,71.12vw,1024px);background:#3a2a20 url(assets/prototipo/home-hero.png) center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:var(--nav-h);text-align:center;color:var(--fondo-oscuro)}
.hero h1{font:400 clamp(72px,13.9vw,200px)/.775 var(--f-script);margin:0;color:var(--fondo-oscuro)}
.hero h1 span{display:block;white-space:nowrap}
.hero h1 span:first-child{transform:translateX(clamp(-130px,-9.06vw,0px))}
.hero h1 span:last-child{transform:translateX(clamp(0px,11.6vw,167px))}
.hero .btn-reserva{margin-top:clamp(40px,5vw,72px)}

/* ¿Quién es Lilium? */
.historia{position:relative;background:var(--verde);color:var(--fondo-oscuro);min-height:clamp(760px,71.12vw,1024px);padding:157px 16px 200px}
.historia .w1440{display:grid;grid-template-columns:509px 629px;justify-content:center;gap:94px;align-items:start}
.historia .retrato img{width:509px;height:709px}
.historia h2{font:400 100px/1.2 var(--f-script);color:var(--melocoton);margin:136px 0 8px}
.historia .texto{font:400 24px/1.25 var(--f-serif)}
.historia .texto p{margin:0 0 1.25em}
.historia .texto b{font-weight:600}
@media (max-width:1279px){.historia .w1440{grid-template-columns:minmax(0,400px) minmax(0,560px);gap:48px}.historia .retrato img{width:100%;height:auto}.historia h2{font-size:80px;margin-top:60px}.historia .texto{font-size:21px}}
@media (max-width:860px){.historia{padding:110px 16px 170px}.historia .w1440{grid-template-columns:1fr;justify-items:center;gap:24px}.historia .retrato{max-width:320px}.historia h2{font-size:60px;margin-top:0;text-align:center}.historia .texto{font-size:19px}}

/* ¿Cómo reservar? */
.como{background:var(--fondo-oscuro);padding:55px 16px 100px;text-align:center}
.como h2{font:400 100px/1.05 var(--f-script);color:var(--terracota);margin:0 0 30px}
.como .sub{font:400 24px/1 var(--f-old);margin:0 0 30px}
.dots{position:relative;display:flex;justify-content:space-between;width:316px;max-width:100%;margin:0 auto;height:12px;align-items:center}
.dots::before{content:"";position:absolute;left:6px;right:6px;top:50%;border-top:1.5px solid currentColor;transform:translateY(-50%)}
.dots > *{position:relative;width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;background:var(--dot-bg,var(--fondo-oscuro));padding:0}
.dots > [aria-current="step"],.dots > .on{background:currentColor}
.como .dots{color:var(--terracota)}
@media (max-width:720px){.como h2{font-size:64px}.como .sub{font-size:19px}}

/* Componente pasos */
.pasos{position:relative;background:var(--terracota);color:var(--fondo-oscuro);min-height:590px;overflow:hidden}
.pasos .w1440{min-height:590px}
.pasos .mano{position:absolute;left:9px;top:11px;width:575px;height:579px}
.pasos .paso-txt{position:relative;margin-left:39.03%;padding-top:123px;width:min(576px,56%);display:flex;flex-direction:column;gap:34px;padding-bottom:60px}
.pasos .dots{--dot-bg:var(--terracota);color:var(--fondo-oscuro);margin:0}
.pasos .dots button{cursor:pointer}
.pasos .num{font:500 40px/1 var(--f-serif);margin:0}
.pasos h3{font:400 40px/1.15 var(--f-serif);text-transform:uppercase;margin:0}
.pasos .desc{font:400 16px/1.25 var(--f-sans);color:var(--fondo);max-width:500px;margin:0}
.pasos .desc p{margin:0}
.pasos .nav-pasos{display:flex;gap:10px}
@media (max-width:959px){.pasos .mano{position:relative;left:auto;top:auto;width:300px;height:auto;margin:0 auto -40px}.pasos .paso-txt{margin:0 auto;width:auto;padding:24px 24px 56px}.pasos h3,.pasos .num{font-size:30px}}

/* ¿Qué necesita el ritual? */
.ritual{position:relative;background:var(--crudo);color:var(--fondo);padding:46px 16px 80px;overflow:hidden}
.ritual h2{font:400 128px/.82 var(--f-script);color:var(--fondo-oscuro);text-align:center;margin:0 0 71px;padding-top:.15em}
.req-grid{display:flex;justify-content:center;align-items:flex-end;gap:88px}
.req{display:flex;flex-direction:column;align-items:center;text-align:center}
.req:nth-child(1){width:362px}.req:nth-child(2){width:379px}.req:nth-child(3){width:360px}
.req .foto{margin:0 -40px -120px}
.req .foto img{max-width:none}
.req h3{position:relative;font:400 32px/1.1 var(--f-old);text-transform:uppercase;margin:0 0 9px;color:var(--fondo)}
.req p{position:relative;margin:0;font:400 16px/1.2 var(--f-sans)}
@media (max-width:1279px){.req-grid{gap:24px}.req .foto img{width:80%;height:auto;margin:0 auto}.req h3{font-size:26px}}
@media (max-width:959px){.ritual h2{font-size:76px}.req-grid{flex-direction:column;align-items:center;gap:48px}.req,.req:nth-child(n){width:100%;max-width:379px}.req .foto{margin:0 0 -90px}.req .foto img{width:100%;height:auto}}

/* Cuándo / Dónde */
.lugar{position:relative;background:var(--fondo-oscuro);color:#000;min-height:569px}
.lugar .mapa{position:absolute;left:316px;top:18px;width:893px;height:551px;object-fit:cover}
.lugar .dato{position:absolute;z-index:3}
.lugar .dato h3{display:flex;align-items:center;gap:19px;font:400 40px/1 var(--f-old);margin:0 0 11px;color:#000}
.lugar .dato h3::before{content:"";width:28px;height:28px;border-radius:50%;background:#000;flex:none}
.lugar .dato p{margin:0;font:400 16px/1.2 var(--f-sans)}
.lugar .cuando{left:1101px;top:143px}
.lugar .cuando p{padding-left:53px}
.lugar .donde{left:63px;top:435px;text-align:right}
.lugar .donde h3{justify-content:flex-end}
.lugar .donde a{color:inherit}
@media (max-width:1439px){.lugar .mapa{left:50%;transform:translateX(-47%);max-width:62vw;height:auto}.lugar .cuando{left:auto;right:16px}}
@media (max-width:959px){.lugar{padding:120px 16px 40px;display:grid;gap:24px;justify-items:center}.lugar .mapa{position:static;transform:none;max-width:100%;width:100%}.lugar .dato{position:static;text-align:left}.lugar .donde h3{justify-content:flex-start}.lugar .cuando p{padding-left:47px}.lugar .donde p{padding-left:47px}}

/* ¿Eres Erasmus? */
.erasmus-band{background:var(--rosa);min-height:627px;padding:79px 16px 80px;text-align:center;color:var(--fondo-oscuro)}
.erasmus-band h2{font:400 96px/1.2 var(--f-script);color:var(--fondo);margin:0 0 18px}
.erasmus-band p{font:400 24px/1.3 var(--f-serif);max-width:629px;margin:0 auto}
.erasmus-band .actions{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;margin-top:48px}
.btn-erasmus{min-height:41px;padding:6px 18px;border:1.2px solid var(--verde);border-radius:2px;background:transparent;color:var(--verde);font:500 20px/1.2 var(--f-serif);text-decoration:none}
.btn-erasmus.solid{background:var(--verde);color:var(--fondo-oscuro)}
@media (max-width:720px){.erasmus-band{min-height:0}.erasmus-band h2{font-size:64px}.erasmus-band p{font-size:20px}}

/* Preguntas frecuentes */
.faq{position:relative;min-height:754px;background:#3a2a20 url(assets/prototipo/faq-fondo.png) center/cover no-repeat;color:var(--fondo)}
.faq-wrap{position:relative;margin-left:59.8%;width:478px;max-width:calc(100% - 32px);padding:93px 0 80px}
.faq .eyebrow-dot{display:flex;align-items:center;gap:11px;font:400 16px/1.2 var(--f-sans);text-transform:uppercase;margin:0 0 21px}
.faq .eyebrow-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fondo)}
.faq h2{font:400 36px/1.3 var(--f-serif);text-transform:uppercase;color:#fff;margin:0 0 21px;max-width:466px}
details.acc{border-bottom:1.2px solid var(--fondo)}
details.acc summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;padding:16px 12px;font:400 16px/1.3 var(--f-serif);color:var(--fondo)}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font:400 16px/1.2 var(--f-sans);flex:none}
details.acc[open]{background:rgba(255,250,242,.47)}
details.acc[open] summary::after{content:"−"}
details.acc .acc-body{padding:0 12px 18px;font:400 13px/1.3 var(--f-sans);color:#fff}
details.acc .acc-body p:last-child{margin:0}
@media (max-width:959px){.faq{min-height:0}.faq::before{content:"";position:absolute;inset:0;background:rgba(41,47,32,.55)}.faq-wrap{margin:0 auto;padding:64px 0}}

/* CTA invitación + pie */
.cta-final{height:clamp(220px,34.3vw,494px);background:url(assets/prototipo/cta-primavera.png) center/cover no-repeat}
.foot{background:var(--verde);color:var(--fondo-oscuro);font:400 16px/1.2 var(--f-sans);min-height:84px;display:flex;align-items:center}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:clamp(24px,15vw,217px);row-gap:10px;padding:16px}
.foot a,.foot button{color:inherit;background:none;border:0;padding:0;font:inherit;text-decoration:none}

<script>
/* =========================================================
   PARÁMETROS (editables)
   ========================================================= */
const DEMO_MODE = true;               // false → oculta el botón DEMO y los avisos de código
const MIN_GRUPO = 3;
const MAX_GRUPO = 6;
const HORAS_CONFIRMACION = 48;
const DOMINIO_PERMITIDO = "alumnado.esada.es";

  fecha: new Date(2026, 10, 20),      // 20 noviembre 2026 (mes 0-indexado)

  mapsUrl: "https://www.google.com/maps/search/?api=1&query=ESADA+Escuela+Superior+de+Arte+y+Dise%C3%B1o+de+Andaluc%C3%ADa+Granada"
};

/* Fragmentos de la frase secreta (1 por integrante; si sois menos de 6, alguien recibe varios).

/* Pistas del escape room (1 por entrada). → Las define el equipo de atrezo. */
const PISTAS = {
  es: ["Cuenta los pétalos antes de abrir nada.", "No todo lo que brilla es el sol.", "La corona pesa más de lo que parece.", "El primer reloj no tenía agujas.", "Lo que cuelga del palo de mayo no es decoración.", "Escuchad la canción: repite un número."],
  en: ["Count the petals before opening anything.", "Not everything that shines is the sun.", "The crown weighs more than it looks.", "The first clock had no hands.", "What hangs from the maypole isn't decoration.", "Listen to the song: it repeats a number."]
};
/* Aviso legal: textos placeholder editables */
const AVISO_LEGAL = {
  es: ["Riesgo de [X]: descripción del riesgo y medidas tomadas.", "Riesgo de [Y]: espacios con poca iluminación y elementos de atrezo en el suelo.", "Aviso de luces: la experiencia incluye luces estroboscópicas e intermitentes. Si tienes fotosensibilidad o epilepsia, avisa a la organización antes de entrar.", "Riesgo de [Z]: humo artificial / sonidos fuertes.", "La organización no se hace cargo de [objetos personales perdidos, daños causados por un uso indebido del material, …].", "Es obligatorio seguir en todo momento las indicaciones del Game Master."],
  en: ["Risk of [X]: description of the risk and measures taken.", "Risk of [Y]: dimly lit spaces and props on the floor.", "Light warning: the experience includes strobe and flashing lights. If you are photosensitive or have epilepsy, tell the organisers before entering.", "Risk of [Z]: artificial smoke / loud sounds.", "The organisers are not responsible for [lost personal belongings, damage caused by misuse of the props, …].", "You must follow the Game Master's instructions at all times."]
};

/* =========================================================
   ESTADO (en memoria: nada de localStorage/sessionStorage)
   ========================================================= */
const H = 3600e3;
const dom = (n) => n + "@" + DOMINIO_PERMITIDO;
const state = {
  lang: (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es",
  sesion: null,                    // { email }
  verif: { fase: 1, email: "", codigo: "", reenvioEn: 0 },
  draft: { miembros: [], turnoId: null, equipo: "" },
  filtroErasmus: false,

  pasoHome: 0                      // paso visible en «Cómo reservar»
};
const L = (es, en) => state.lang === "en" ? en : es;

/* =========================================================
   BACKEND SIMULADO · base de datos + API
   (sustituir cada función de `api` por una llamada real)
   ========================================================= */
function seed() {
  const now = Date.now();
  return {
    turnos: [
      { id: "t0", inicio: "16:00", fin: "17:00", erasmus: true,  equipo: "Midnight Sun" },
      { id: "t1", inicio: "17:00", fin: "18:00", erasmus: false, equipo: "Las Hijas del Solsticio" },
      { id: "t2", inicio: "18:30", fin: "19:30", erasmus: false, equipo: "" },
      { id: "t3", inicio: "19:45", fin: "20:45", erasmus: false, equipo: "Los Druidas del Patio" },
      { id: "t4", inicio: "21:00", fin: "22:00", erasmus: false, equipo: "" },
      { id: "t5", inicio: "22:15", fin: "23:15", erasmus: true,  equipo: "" }
    ],
    reservas: [
      { id: "r1", turnoId: "t1", lider: dom("ana.garcia"), creada: now - 36 * H, medio: false,
        miembros: [m("ana.garcia", 1), m("marta.lopez", 1), m("pablo.ruiz", 0), m("irene.sanz", 1)] },
      { id: "r2", turnoId: "t3", lider: dom("jon.etxeberria"), creada: now - 60 * H, medio: false,
        miembros: [m("jon.etxeberria", 1), m("lucas.moreno", 1), m("sara.diaz", 1), m("hugo.navarro", 1), m("claudia.romero", 1), m("nerea.gil", 1)] },
      { id: "r3", turnoId: "t0", lider: dom("emma.schmidt"), creada: now - 10 * H, medio: false,
        miembros: [m("emma.schmidt", 1), m("luca.rossi", 0)] }
    ],
    codigos: {},
    espera: {},

  function m(n, c) { return { email: dom(n), confirmado: !!c }; }

let db = seed();

const EMAIL_RE = new RegExp("^[a-zñç]+(?:[.\\-][a-zñç]+)+@" + DOMINIO_PERMITIDO.replace(/\./g, "\\.") + "$", "i");
const PERSONALES = /@(gmail|googlemail|hotmail|outlook|live|yahoo|icloud|me|msn|proton(mail)?|aol|gmx)\./i;

function validarCorreo(raw) {
  const e = (raw || "").trim().toLowerCase();
  if (!e) return { ok: false, motivo: "vacio", email: e };
  if (EMAIL_RE.test(e)) return { ok: true, motivo: "ok", email: e };
  if (PERSONALES.test(e)) return { ok: false, motivo: "personal", email: e };
  const at = e.indexOf("@");
  if (at === -1) return { ok: false, motivo: "incompleto", email: e };
  const domPart = e.slice(at + 1);
  if (domPart === DOMINIO_PERMITIDO) return { ok: false, motivo: "formato", email: e };
  if (DOMINIO_PERMITIDO.startsWith(domPart)) return { ok: false, motivo: "incompleto", email: e };
  return { ok: false, motivo: "dominio", email: e };
}
function mensajeCorreo(motivo) {
  return {
    vacio: L("Escribe tu correo institucional.", "Type your school email."),
    incompleto: L("Sigue escribiendo… debe terminar en @" + DOMINIO_PERMITIDO, "Keep typing… it must end in @" + DOMINIO_PERMITIDO),
    personal: L("¡Ups! Ese parece un correo personal 🙂 Solo vale el institucional: nombre.apellido@" + DOMINIO_PERMITIDO, "Oops! That looks like a personal email 🙂 Only your school one works: name.surname@" + DOMINIO_PERMITIDO),
    dominio: L("Ese dominio no es de ESADA. Usa nombre.apellido@" + DOMINIO_PERMITIDO, "That domain isn't ESADA's. Use name.surname@" + DOMINIO_PERMITIDO),
    formato: L("Casi: el formato es nombre.apellido@" + DOMINIO_PERMITIDO, "Almost: the format is name.surname@" + DOMINIO_PERMITIDO),
    ok: L("Correo institucional válido", "Valid school email")
  }[motivo];
}

const api = {
  /** Envía (simula) un código de 6 dígitos al correo. */
  verificarCorreo(email) {
    const v = validarCorreo(email);
    if (!v.ok) return { ok: false, motivo: v.motivo };
    const codigo = String(Math.floor(100000 + Math.random() * 900000));
    db.codigos[v.email] = codigo;
    return { ok: true, codigo };               // en producción NO se devuelve el código
  },
  comprobarCodigo(email, codigo) { return db.codigos[email] === codigo; },
  buscarReservaDe(email) { return db.reservas.find(r => r.miembros.some(x => x.email === email)) || null; },
  correoInscrito(email) { return !!api.buscarReservaDe(email); },
  turno(id) { return db.turnos.find(t => t.id === id); },
  personasEnTurno(id) { return db.reservas.filter(r => r.turnoId === id).flatMap(r => r.miembros); },
  infoTurno(id) {
    const t = api.turno(id), personas = api.personasEnTurno(id), n = personas.length;
    const estado = n === 0 ? "libre" : n >= MAX_GRUPO ? "completo" : "formacion";
    return { ...t, personas, ocupadas: n, hueco: Math.max(0, MAX_GRUPO - n), estado };
  },
  turnos() { return db.turnos.map(t => api.infoTurno(t.id)); },
  /** Crea una reserva. El líder queda confirmado (ya verificó su correo); el resto recibe un correo. */
  reservar({ lider, miembros, turnoId, equipo }) {
    const todos = [lider, ...miembros];
    const ya = todos.find(e => api.correoInscrito(e));
    if (ya) return { ok: false, error: "inscrito", email: ya };
    const t = api.infoTurno(turnoId);
    if (t.hueco < todos.length) return { ok: false, error: "sin_hueco" };
    if (t.estado === "libre" && todos.length < MIN_GRUPO) return { ok: false, error: "minimo" };
    if (t.estado === "libre" && equipo) api.turno(turnoId).equipo = equipo.trim().slice(0, 40);
    const r = { id: "r" + (db.seq++), turnoId, lider, creada: Date.now(), medio: false,
      miembros: todos.map(e => ({ email: e, confirmado: e === lider })) };
    db.reservas.push(r);
    return { ok: true, reserva: r };
  },
  confirmarAsistencia(email) {
    const r = api.buscarReservaDe(email); if (!r) return null;
    r.miembros.find(x => x.email === email).confirmado = true;
    return r;
  },
  /** Cambia SOLO a esta persona a otro turno con hueco; el resto del grupo no se mueve. */
  cambiarHora(email, turnoId) {
    const r = api.buscarReservaDe(email); const t = api.infoTurno(turnoId);
    if (!r || t.hueco < 1 || t.estado === "libre") return { ok: false };
    const yo = r.miembros.find(x => x.email === email);
    api._sacar(r, email);
    const nueva = { id: "r" + (db.seq++), turnoId, lider: email, creada: Date.now(), medio: false, miembros: [{ email, confirmado: yo.confirmado }] };
    db.reservas.push(nueva);
    return { ok: true, reserva: nueva };
  },
  /** Cancela SOLO la plaza de esta persona. */
  cancelarAsistencia(email) {
    const r = api.buscarReservaDe(email); if (!r) return { ok: false };
    api._sacar(r, email); return { ok: true };
  },
  cancelarGrupo(reservaId, email) {
    const r = db.reservas.find(x => x.id === reservaId);
    if (!r || r.lider !== email) return { ok: false };
    db.reservas = db.reservas.filter(x => x !== r);
    if (!api.personasEnTurno(r.turnoId).length) api.turno(r.turnoId).equipo = "";
    return { ok: true };
  },
  renombrarEquipo(reservaId, email, nombre) {
    const r = db.reservas.find(x => x.id === reservaId);
    if (!r || r.lider !== email) return { ok: false };
    api.turno(r.turnoId).equipo = nombre.trim().slice(0, 40); return { ok: true };
  },
  apuntarListaEspera(turnoId, email) { (db.espera[turnoId] ||= []).includes(email) || db.espera[turnoId].push(email); return { ok: true }; },
  /** Cron simulado: aplica las reglas al vencer el plazo de confirmación. */
  aplicarPlazo(reservaId) {
    const r = db.reservas.find(x => x.id === reservaId); if (!r) return null;
    const conf = r.miembros.filter(x => x.confirmado);
    const perdidos = r.miembros.length - conf.length;
    r.miembros = conf;
    if (!conf.length) { db.reservas = db.reservas.filter(x => x !== r); return { eliminada: true, perdidos }; }
    if (!conf.some(x => x.email === r.lider)) r.lider = conf[0].email;
    r.medio = conf.length < MIN_GRUPO;
    r.creada = Date.now() - HORAS_CONFIRMACION * H - 1;
    return { perdidos, medio: r.medio };
  },
  _sacar(r, email) {
    r.miembros = r.miembros.filter(x => x.email !== email);
    if (!r.miembros.length) { db.reservas = db.reservas.filter(x => x !== r); }
    else {
      if (r.lider === email) r.lider = r.miembros[0].email;
      if (r.miembros.length < MIN_GRUPO) r.medio = true;
    }
    if (!api.personasEnTurno(r.turnoId).length) api.turno(r.turnoId).equipo = "";
  },
  /** Estado del grupo para mostrar */
  estadoGrupo(r) {
    const enTurno = api.personasEnTurno(r.turnoId).length;
    if (enTurno < MIN_GRUPO || r.medio && enTurno < MIN_GRUPO) return "medio";
    return r.miembros.every(x => x.confirmado) ? "confirmada" : "pendiente";
  },
  limite(r) { return r.creada + HORAS_CONFIRMACION * H; }
};

/* QR simulado (decorativo, determinista) */
function qrSVG(seedStr) {
  let h = 2166136261; for (const c of seedStr) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
  const N = 25; let rects = "";
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#292F20"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#FFFAF2"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#292F20"/>`;
  const inF = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!inF(x, y) && rnd() > .5) rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return `<svg viewBox="0 0 ${N} ${N}" role="img" aria-label="${L("Código QR de la entrada (simulado)", "Ticket QR code (simulated)")}" shape-rendering="crispEdges"><rect width="${N}" height="${N}" fill="#FFFAF2"/><g fill="#292F20">${rects}</g>${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}</svg>`;
}

}
function closeModal() {
  $("#modal-root").innerHTML = ""; document.body.style.overflow = "";
  lastFocus && document.contains(lastFocus) && lastFocus.focus();
}
document.addEventListener("keydown", (e) => {
  const m = $(".modal"); if (!m) return;
  if (e.key === "Escape") closeModal();
  if (e.key === "Tab") {
    const f = $$('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', m).filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

function evaluarTurno(t, n) {
  if (t.estado === "completo") return { ok: false, tipo: "completo" };
  if (t.estado === "libre" && n < MIN_GRUPO) return { ok: false, tipo: "minimo" };
  if (t.estado === "formacion" && t.hueco < n) return { ok: false, tipo: "hueco" };
  return { ok: true };
}

const RUTAS = { "/verificar": pVerificar, "/home": pHome, "/reserva/1": pPaso1, "/reserva/2": pPaso2, "/reserva/3": pPaso3, "/mi-reserva": pMiReserva };
let rutaActual = null;
function router() {
  let path = location.hash.replace(/^#/, "") || "/home";
  if (!RUTAS[path]) path = "/home";
  if (!state.sesion && path !== "/verificar") return go("/verificar");
  if (state.sesion && path === "/verificar") return go(api.buscarReservaDe(state.sesion.email) ? "/mi-reserva" : "/home");
  if (state.sesion) {
    const r = api.buscarReservaDe(state.sesion.email);
    if (path !== "/reserva/3") state.exito = null;
    if (path.startsWith("/reserva") && r && !(path === "/reserva/3" && state.exito)) { toast(L("Ya tienes una reserva: un correo = una reserva.", "You already have a booking: one email = one booking.")); return go("/mi-reserva"); }
    if (path === "/mi-reserva" && !r) return go("/home");

  }

}

      render(); toast(I.mail + L("Código reenviado", "Code resent"), "ok"); break;
    }
    case "quitar": state.draft.miembros.splice(+el.dataset.i, 1); render(); break;
    case "filtro": state.filtroErasmus = el.dataset.v === "1"; render(); break;
    case "elegir": state.draft.turnoId = id; render(); { const b = $(`[data-act="elegir"][data-id="${id}"]`); b && b.focus({ preventScroll: true }); } break;
    case "espera": api.apuntarListaEspera(id, yo); state.esperaMia[id] = true; render(); toast(I.check + L("Te avisaremos por correo si se libera una plaza.", "We'll email you if a spot opens up."), "ok"); break;

      <h4>${L("Estados de ejemplo", "Sample states")}</h4><div class="grid">${est.map(([k, t]) => `<button data-act="demo-estado" data-v="${k}" class="${state.sesion && state.sesion.email === USUARIOS_DEMO[k] ? "cur" : ""}">${t}</button>`).join("")}</div>
      <h4>${L("Datos", "Data")}</h4><div class="grid"><button data-act="demo-reset">${L("Reiniciar datos", "Reset data")}</button>${state.sesion ? `<button data-act="demo-go" data-v="/verificar">${L("Cerrar sesión", "Sign out")}</button>` : ""}</div>
      <div class="who">${state.sesion ? L("Sesión: ", "Session: ") + esc(state.sesion.email) : L("Sin sesión", "No session")}</div>
      <div class="who">${L("Prueba también: correo ya inscrito → marta.lopez@", "Also try: already-booked email → marta.lopez@") + DOMINIO_PERMITIDO}</div>
    </div>` : ""}`;
}
