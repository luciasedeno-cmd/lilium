# Cada hora llama a /api/cron: aplica el plazo de 48 h y envía los recordatorios de las 12 h.
# Necesita dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   LILIUM_URL   → la URL pública de la web, p. ej. https://lilium.vercel.app
#   CRON_SECRET  → el mismo valor que la variable CRON_SECRET de Vercel
name: Recordatorios de confirmación

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/cron
        env:
          LILIUM_URL: ${{ secrets.LILIUM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$LILIUM_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secretos LILIUM_URL o CRON_SECRET; no se hace nada."
            exit 0
          fi
          curl --fail --silent --show-error -H "Authorization: Bearer $CRON_SECRET" "$LILIUM_URL/api/cron"
