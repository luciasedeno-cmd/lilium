<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · Lilium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baskervville:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,600;1,400&family=Luxurious+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/reserva.css">
</head>
<body data-pagina="acceso">

  <header class="nav-reserva">
    <a class="logo" href="inicio.html" aria-label="Lilium, inicio">
      <img src="assets/img/logo-lilium.png" alt="Lilium">
    </a>
    <div class="idioma" role="group" aria-label="Idioma">
      <button type="button" aria-pressed="true" data-idioma="es">ES</button>
      <button type="button" aria-pressed="false" data-idioma="en">EN</button>
    </div>
  </header>

  <main>
    <section class="acceso">
      <p class="acceso__etiqueta">ACCESO</p>
      <h1 class="acceso__titulo">Antes de entrar al prado...</h1>
      <p class="acceso__intro">Solo el alumnado de ESADA puede reservar. Confirma tu correo institucional y te enviaremos un código.</p>

      <form id="form-acceso" novalidate>
        <label for="correo">Correo institucional</label>
        <input class="campo" id="correo" name="correo" type="email" placeholder="E-mail" autocomplete="email" required aria-describedby="correo-ayuda correo-error">
        <p class="acceso__ayuda" id="correo-ayuda">Formato: nombreapellido@alumnado.esada.es</p>
        <p class="error" id="correo-error" role="alert"></p>
        <button class="boton" type="submit">Enviar código</button>
      </form>
    </section>
  </main>

  <script src="js/reserva.js"></script>
</body>
</html>
