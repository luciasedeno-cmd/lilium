<script>
/* =========================================================
   PARÁMETROS (editables)
   ========================================================= */
const DEMO_MODE = true;               // false → oculta el botón DEMO y los avisos de código
const MIN_GRUPO = 3;
const MAX_GRUPO = 6;
const HORAS_CONFIRMACION = 48;
const DOMINIO_PERMITIDO = "alumnado.esada.es";
const EVENTO = {                      // SOLO UN DÍA de evento
  fecha: new Date(2026, 10, 20),      // 20 noviembre 2026 (mes 0-indexado)
  lugar: { es: "ESADA · Sala polivalente (planta baja)", en: "ESADA · Multipurpose room (ground floor)" },
  mapsUrl: "https://www.google.com/maps/search/?api=1&query=ESADA+Escuela+Superior+de+Arte+y+Dise%C3%B1o+de+Andaluc%C3%ADa+Granada"
};
/* Wireframe: el logotipo se muestra como caja LOGO */

/* Fragmentos de la frase secreta (1 por integrante; si sois menos de 6, alguien recibe varios).
   Juntos revelan la palabra que hay que decir al Game Master. → Los define el equipo de atrezo. */
const FRAGMENTOS = {
  es: ["I · «Cuando el sol", "II · no quiera dormir,", "III · buscad la flor", "IV · que nunca se cierra:", "V · decid su nombre", "VI · y el prado os abrirá paso.»"],
  en: ["I · “When the sun", "II · refuses to sleep,", "III · seek the flower", "IV · that never closes:", "V · speak its name", "VI · and the meadow will let you in.”"]

/* Pistas del escape room (1 por entrada). → Las define el equipo de atrezo. */
const PISTAS = {
  es: ["Cuenta los pétalos antes de abrir nada.", "No todo lo que brilla es el sol.", "La corona pesa más de lo que parece.", "El primer reloj no tenía agujas.", "Lo que cuelga del palo de mayo no es decoración.", "Escuchad la canción: repite un número."],
  en: ["Count the petals before opening anything.", "Not everything that shines is the sun.", "The crown weighs more than it looks.", "The first clock had no hands.", "What hangs from the maypole isn't decoration.", "Listen to the song: it repeats a number."]
};
/* Aviso legal: textos placeholder editables */
const AVISO_LEGAL = {
  es: ["Riesgo de [X]: descripción del riesgo y medidas tomadas.", "Riesgo de [Y]: espacios con poca iluminación y elementos de atrezo en el suelo.", "Aviso de luces: la experiencia incluye luces estroboscópicas e intermitentes. Si tienes fotosensibilidad o epilepsia, avisa a la organización antes de entrar.", "Riesgo de [Z]: humo artificial / sonidos fuertes.", "La organización no se hace cargo de [objetos personales perdidos, daños causados por un uso indebido del material, …].", "Es obligatorio seguir en todo momento las indicaciones del Game Master."],

/* =========================================================
   ESTADO (en memoria: nada de localStorage/sessionStorage)
   ========================================================= */
const H = 3600e3;
const dom = (n) => n + "@" + DOMINIO_PERMITIDO;
const state = {
  lang: (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es",
  sesion: null,                    // { email }
  verif: { fase: 1, email: "", codigo: "", reenvioEn: 0 },
  draft: { miembros: [], turnoId: null, equipo: "" },
  filtroErasmus: false,
  popupVisto: false,

const EMAIL_RE = new RegExp("^[a-zñç]+(?:[.\\-][a-zñç]+)+@" + DOMINIO_PERMITIDO.replace(/\./g, "\\.") + "$", "i");
const PERSONALES = /@(gmail|googlemail|hotmail|outlook|live|yahoo|icloud|me|msn|proton(mail)?|aol|gmx)\./i;

function validarCorreo(raw) {
  const e = (raw || "").trim().toLowerCase();
  if (!e) return { ok: false, motivo: "vacio", email: e };
  if (EMAIL_RE.test(e)) return { ok: true, motivo: "ok", email: e };
  if (PERSONALES.test(e)) return { ok: false, motivo: "personal", email: e };
  const at = e.indexOf("@");
  if (at === -1) return { ok: false, motivo: "incompleto", email: e };
  const domPart = e.slice(at + 1);
  if (domPart === DOMINIO_PERMITIDO) return { ok: false, motivo: "formato", email: e };
  if (DOMINIO_PERMITIDO.startsWith(domPart)) return { ok: false, motivo: "incompleto", email: e };
  return { ok: false, motivo: "dominio", email: e };
}
function mensajeCorreo(motivo) {
  return {
    vacio: L("Escribe tu correo institucional.", "Type your school email."),
    incompleto: L("Sigue escribiendo… debe terminar en @" + DOMINIO_PERMITIDO, "Keep typing… it must end in @" + DOMINIO_PERMITIDO),
    personal: L("¡Ups! Ese parece un correo personal 🙂 Solo vale el institucional: nombre.apellido@" + DOMINIO_PERMITIDO, "Oops! That looks like a personal email 🙂 Only your school one works: name.surname@" + DOMINIO_PERMITIDO),
    dominio: L("Ese dominio no es de ESADA. Usa nombre.apellido@" + DOMINIO_PERMITIDO, "That domain isn't ESADA's. Use name.surname@" + DOMINIO_PERMITIDO),
    formato: L("Casi: el formato es nombre.apellido@" + DOMINIO_PERMITIDO, "Almost: the format is name.surname@" + DOMINIO_PERMITIDO),
    ok: L("Correo institucional válido", "Valid school email")
  }[motivo];
}

const api = {
  /** Envía (simula) un código de 6 dígitos al correo. */
  verificarCorreo(email) {
    const v = validarCorreo(email);
    if (!v.ok) return { ok: false, motivo: v.motivo };
    const codigo = String(Math.floor(100000 + Math.random() * 900000));
    db.codigos[v.email] = codigo;
    return { ok: true, codigo };               // en producción NO se devuelve el código
  },
  comprobarCodigo(email, codigo) { return db.codigos[email] === codigo; },
  buscarReservaDe(email) { return db.reservas.find(r => r.miembros.some(x => x.email === email)) || null; },
  correoInscrito(email) { return !!api.buscarReservaDe(email); },
  turno(id) { return db.turnos.find(t => t.id === id); },
  personasEnTurno(id) { return db.reservas.filter(r => r.turnoId === id).flatMap(r => r.miembros); },
  infoTurno(id) {
    const t = api.turno(id), personas = api.personasEnTurno(id), n = personas.length;
    const estado = n === 0 ? "libre" : n >= MAX_GRUPO ? "completo" : "formacion";
    return { ...t, personas, ocupadas: n, hueco: Math.max(0, MAX_GRUPO - n), estado };
  },
  turnos() { return db.turnos.map(t => api.infoTurno(t.id)); },
  /** Crea una reserva. El líder queda confirmado (ya verificó su correo); el resto recibe un correo. */
  reservar({ lider, miembros, turnoId, equipo }) {
    const todos = [lider, ...miembros];
    const ya = todos.find(e => api.correoInscrito(e));
    if (ya) return { ok: false, error: "inscrito", email: ya };
    const t = api.infoTurno(turnoId);
    if (t.hueco < todos.length) return { ok: false, error: "sin_hueco" };
    if (t.estado === "libre" && todos.length < MIN_GRUPO) return { ok: false, error: "minimo" };
    if (t.estado === "libre" && equipo) api.turno(turnoId).equipo = equipo.trim().slice(0, 40);
    const r = { id: "r" + (db.seq++), turnoId, lider, creada: Date.now(), medio: false,
      miembros: todos.map(e => ({ email: e, confirmado: e === lider })) };
    db.reservas.push(r);
    return { ok: true, reserva: r };
  },
  confirmarAsistencia(email) {
    const r = api.buscarReservaDe(email); if (!r) return null;
    r.miembros.find(x => x.email === email).confirmado = true;
    return r;
  },
  /** Cambia SOLO a esta persona a otro turno con hueco; el resto del grupo no se mueve. */
  cambiarHora(email, turnoId) {
    const r = api.buscarReservaDe(email); const t = api.infoTurno(turnoId);
    if (!r || t.hueco < 1 || t.estado === "libre") return { ok: false };
    const yo = r.miembros.find(x => x.email === email);
    api._sacar(r, email);
    const nueva = { id: "r" + (db.seq++), turnoId, lider: email, creada: Date.now(), medio: false, miembros: [{ email, confirmado: yo.confirmado }] };
    db.reservas.push(nueva);
    return { ok: true, reserva: nueva };
  },
  /** Cancela SOLO la plaza de esta persona. */
  cancelarAsistencia(email) {
    const r = api.buscarReservaDe(email); if (!r) return { ok: false };
    api._sacar(r, email); return { ok: true };
  },
  cancelarGrupo(reservaId, email) {
    const r = db.reservas.find(x => x.id === reservaId);
    if (!r || r.lider !== email) return { ok: false };
    db.reservas = db.reservas.filter(x => x !== r);
    if (!api.personasEnTurno(r.turnoId).length) api.turno(r.turnoId).equipo = "";
    return { ok: true };
  },
  renombrarEquipo(reservaId, email, nombre) {
    const r = db.reservas.find(x => x.id === reservaId);
    if (!r || r.lider !== email) return { ok: false };
    api.turno(r.turnoId).equipo = nombre.trim().slice(0, 40); return { ok: true };
  },
  apuntarListaEspera(turnoId, email) { (db.espera[turnoId] ||= []).includes(email) || db.espera[turnoId].push(email); return { ok: true }; },
  /** Cron simulado: aplica las reglas al vencer el plazo de confirmación. */
  aplicarPlazo(reservaId) {
    const r = db.reservas.find(x => x.id === reservaId); if (!r) return null;
    const conf = r.miembros.filter(x => x.confirmado);
    const perdidos = r.miembros.length - conf.length;
    r.miembros = conf;
    if (!conf.length) { db.reservas = db.reservas.filter(x => x !== r); return { eliminada: true, perdidos }; }
    if (!conf.some(x => x.email === r.lider)) r.lider = conf[0].email;
    r.medio = conf.length < MIN_GRUPO;
    r.creada = Date.now() - HORAS_CONFIRMACION * H - 1;
    return { perdidos, medio: r.medio };
  },
  _sacar(r, email) {
    r.miembros = r.miembros.filter(x => x.email !== email);
    if (!r.miembros.length) { db.reservas = db.reservas.filter(x => x !== r); }
    else {
      if (r.lider === email) r.lider = r.miembros[0].email;
      if (r.miembros.length < MIN_GRUPO) r.medio = true;
    }
    if (!api.personasEnTurno(r.turnoId).length) api.turno(r.turnoId).equipo = "";
  },
  /** Estado del grupo para mostrar */
  estadoGrupo(r) {
    const enTurno = api.personasEnTurno(r.turnoId).length;
    if (enTurno < MIN_GRUPO || r.medio && enTurno < MIN_GRUPO) return "medio";
    return r.miembros.every(x => x.confirmado) ? "confirmada" : "pendiente";
  },
  limite(r) { return r.creada + HORAS_CONFIRMACION * H; }
};

/* QR simulado (decorativo, determinista) */
function qrSVG(seedStr) {
  let h = 2166136261; for (const c of seedStr) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
  const N = 25; let rects = "";
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#2E1E10"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#2E1E10"/>`;
  const inF = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!inF(x, y) && rnd() > .5) rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return `<svg viewBox="0 0 ${N} ${N}" role="img" aria-label="${L("Código QR de la entrada (simulado)", "Ticket QR code (simulated)")}" shape-rendering="crispEdges"><rect width="${N}" height="${N}" fill="#fff"/><g fill="#2E1E10">${rects}</g>${finder(0, 0)}${finder(N - 7, 0)}${finder(0, N - 7)}</svg>`;
}

    <div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button class="icon-btn x" data-act="modal-close" aria-label="${L("Cerrar", "Close")}">${I.x}</button>

      <div class="m-body">${body}</div>
      ${actions ? `<div class="modal-actions">${actions}</div>` : ""}
    </div></div>`;
  document.body.style.overflow = "hidden";
  const m = $(".modal");
  onMount && onMount(m);
  (m.querySelector("[data-autofocus]") || m.querySelector(".modal-actions .btn, .m-body button, .m-body input") || m.querySelector(".x")).focus();
}
function closeModal() {
  $("#modal-root").innerHTML = ""; document.body.style.overflow = "";
  lastFocus && document.contains(lastFocus) && lastFocus.focus();
}
document.addEventListener("keydown", (e) => {
  const m = $(".modal"); if (!m) return;
  if (e.key === "Escape") closeModal();
  if (e.key === "Tab") {
    const f = $$('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', m).filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

          if (todos.includes(r.email)) { msg = L("Este correo ya está en tu grupo.", "This email is already in your group."); cls = "err"; }
          else if (api.correoInscrito(r.email)) { msg = L(`${esc(r.email)} ya está inscrito en otra reserva. Cada correo solo puede estar en una.`, `${esc(r.email)} is already in another booking. Each email can only be in one.`); cls = "err"; }
          else { msg = L("Correo válido · pulsa + para añadir", "Valid email · press + to add"); cls = "ok"; }
        } else if ((enviar || inp.value.includes("@")) && r.motivo !== "incompleto" && r.motivo !== "vacio") { msg = mensajeCorreo(r.motivo); cls = "err"; }
        else if (enviar && r.motivo === "vacio") { msg = mensajeCorreo("vacio"); cls = "err"; }

        return cls === "ok" ? r.email : null;
      };
      inp.addEventListener("input", () => evaluar(false));
      $("#f-add").addEventListener("submit", (e) => {
        e.preventDefault(); const ok = evaluar(true); if (!ok) { inp.focus(); return; }
        d.miembros.push(ok); render(); toast(I.check + L("Integrante añadido", "Member added"), "ok"); $("#add-email") && $("#add-email").focus();
      });
    }
  };

  if (t.estado === "formacion" && t.hueco < n) return { ok: false, tipo: "hueco" };
  return { ok: true };
}

const RUTAS = { "/verificar": pVerificar, "/home": pHome, "/reserva/1": pPaso1, "/reserva/2": pPaso2, "/reserva/3": pPaso3, "/mi-reserva": pMiReserva };
let rutaActual = null;
function router() {
  let path = location.hash.replace(/^#/, "") || "/home";
  if (!RUTAS[path]) path = "/home";
  if (!state.sesion && path !== "/verificar") return go("/verificar");
  if (state.sesion && path === "/verificar") return go(api.buscarReservaDe(state.sesion.email) ? "/mi-reserva" : "/home");
  if (state.sesion) {
    const r = api.buscarReservaDe(state.sesion.email);
    if (path !== "/reserva/3") state.exito = null;
    if (path.startsWith("/reserva") && r && !(path === "/reserva/3" && state.exito)) { toast(L("Ya tienes una reserva: un correo = una reserva.", "You already have a booking: one email = one booking.")); return go("/mi-reserva"); }
    if (path === "/mi-reserva" && !r) return go("/home");
    if (path === "/reserva/3" && !state.exito && !state.draft.turnoId) return go("/reserva/2");
  }
  if (path !== "/mi-reserva") state.editandoEquipo = false;
  const cambio = rutaActual !== path; rutaActual = path;
  if (cambio && $(".modal")) closeModal();
  render(!cambio);
}
function render(mantenerScroll = true) {

  document.body.classList.toggle("bb", !!page.bottomBar);
  page.mount && page.mount();
  if (mantenerScroll) window.scrollTo(0, y);

    case "cancelar-grupo": openModal({ title: L("¿Cancelar la reserva del grupo?", "Cancel the group booking?"), body: `<p>${L("Se cancelarán las plazas de <b>todo el grupo</b> y cada integrante recibirá un correo. Esta acción no se puede deshacer.", "<b>The whole group's</b> spots will be cancelled and each member will get an email. This can't be undone.")}</p>`, actions: `<button class="btn btn-ghost" data-act="modal-close" data-autofocus>${L("Volver", "Back")}</button><button class="btn btn-rust" data-act="cancelar-grupo-ok">${L("Sí, cancelar para todos", "Yes, cancel for everyone")}</button>` }); break;
    case "cancelar-grupo-ok": { const r = api.buscarReservaDe(yo); api.cancelarGrupo(r.id, yo); closeModal(); toast(L("Reserva del grupo cancelada.", "Group booking cancelled."), "ok"); go("/home"); break; }
    case "demo-toggle": demoAbierto = !demoAbierto; renderDemo(); break;
    case "demo-go": demoAbierto = false; demoIr(el.dataset.v); break;
    case "demo-estado": demoAbierto = false; demoEstado(el.dataset.v); break;
    case "demo-reset": db = seed(); state.esperaMia = {}; state.draft = { miembros: [], turnoId: null, equipo: "" }; toast(L("Datos de ejemplo reiniciados", "Sample data reset")); router(); break;
  }
});

/* =========================================================
   MODO DEMO
   ========================================================= */
let demoAbierto = false;
const USUARIOS_DEMO = { sin: dom("lucia.martin"), pendiente: dom("pablo.ruiz"), lider: dom("ana.garcia"), confirmada: dom("jon.etxeberria") };
function demoEstado(k) {
  db = seed(); state.esperaMia = {}; state.exito = null; state.popupVisto = k !== "sin";
  state.sesion = { email: USUARIOS_DEMO[k] }; state.draft = { miembros: [], turnoId: null, equipo: "" };
  toast("DEMO · " + USUARIOS_DEMO[k]);
  go(k === "sin" ? "/home" : "/mi-reserva");
}
function demoIr(path) {
  state.exito = null;
  if (path === "/verificar") { state.sesion = null; state.verif = { fase: 1, email: "", codigo: "", reenvioEn: 0 }; return go(path); }
  if (!state.sesion) state.sesion = { email: USUARIOS_DEMO.sin };
  if (path.startsWith("/reserva") && api.buscarReservaDe(state.sesion.email)) {
    state.sesion = { email: USUARIOS_DEMO.sin };
    const r = api.buscarReservaDe(state.sesion.email); if (r) api.cancelarAsistencia(state.sesion.email);
  }
  if (path === "/reserva/3" && !state.draft.turnoId) {
    state.draft = { miembros: [dom("alba.torres"), dom("diego.vega")].filter(e => !api.correoInscrito(e)), turnoId: "t2", equipo: "Las Coronas de Ortiga" };
    if (1 + state.draft.miembros.length < MIN_GRUPO || api.infoTurno("t2").estado !== "libre") { db = seed(); state.draft = { miembros: [dom("alba.torres"), dom("diego.vega")], turnoId: "t2", equipo: "Las Coronas de Ortiga" }; }
  }
  if (path === "/mi-reserva" && !api.buscarReservaDe(state.sesion.email)) {
    if (!api.buscarReservaDe(USUARIOS_DEMO.lider)) db = seed();
    state.sesion = { email: USUARIOS_DEMO.lider };
  }
  go(path);
}
function renderDemo() {
  const root = $("#demo-root"); if (!DEMO_MODE) { root.innerHTML = ""; return; }
  const pags = [["/verificar", "1 · " + L("Verificar", "Verify")], ["/home", "2 · Home"], ["/reserva/1", "3 · " + L("Integrantes", "Members")], ["/reserva/2", "4 · " + L("Hora", "Time")], ["/reserva/3", "5 · " + L("Confirmación", "Confirm")], ["/mi-reserva", "6 · " + L("Mi reserva", "My booking")]];
  const est = [["sin", L("Sin reserva", "No booking")], ["pendiente", L("Reserva pendiente", "Pending booking")], ["confirmada", L("Reserva confirmada", "Confirmed booking")], ["lider", L("Líder · grupo pendiente", "Leader · pending group")]];
  root.innerHTML = `<button class="demo-fab" data-act="demo-toggle" aria-expanded="${demoAbierto}" aria-controls="demo-panel">DEMO</button>
    ${demoAbierto ? `<div class="demo-panel" id="demo-panel" role="dialog" aria-label="${L("Panel de demo", "Demo panel")}">
      <h4>${L("Páginas", "Pages")}</h4><div class="grid">${pags.map(([p, t]) => `<button data-act="demo-go" data-v="${p}" class="${rutaActual === p ? "cur" : ""}">${t}</button>`).join("")}</div>
      <h4>${L("Estados de ejemplo", "Sample states")}</h4><div class="grid">${est.map(([k, t]) => `<button data-act="demo-estado" data-v="${k}" class="${state.sesion && state.sesion.email === USUARIOS_DEMO[k] ? "cur" : ""}">${t}</button>`).join("")}</div>
      <h4>${L("Datos", "Data")}</h4><div class="grid"><button data-act="demo-reset">${L("Reiniciar datos", "Reset data")}</button>${state.sesion ? `<button data-act="demo-go" data-v="/verificar">${L("Cerrar sesión", "Sign out")}</button>` : ""}</div>
      <div class="who">${state.sesion ? L("Sesión: ", "Session: ") + esc(state.sesion.email) : L("Sin sesión", "No session")}</div>
      <div class="who">${L("Prueba también: correo ya inscrito → marta.lopez@", "Also try: already-booked email → marta.lopez@") + DOMINIO_PERMITIDO}</div>
    </div>` : ""}`;
}

/* Arranque */
router();
</script>
</body>
</html>
