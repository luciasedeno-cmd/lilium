<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuenta atrás · Lilium</title>
  <meta name="description" content="Lilium, el escape room de ESADA, abre el 30 de octubre.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baskervville:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,600;1,400&family=Luxurious+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/cuenta-atras.css">
</head>
<body>

  <header class="cuenta-nav">
    <div class="logo">
      <img src="assets/img/logo-lilium.png" alt="Lilium">
    </div>
  </header>

  <main class="cuenta">
    <h1 class="cuenta__titulo">Cinco guías. Un destino</h1>

    <div class="cuenta__reloj" role="timer" aria-live="off" data-cuenta-reloj>
      <div class="cuenta__bloque"><span class="cuenta__numero" data-dias>00</span><span class="cuenta__unidad">Días</span></div>
      <div class="cuenta__bloque"><span class="cuenta__numero" data-horas>00</span><span class="cuenta__unidad">Horas</span></div>
      <div class="cuenta__bloque"><span class="cuenta__numero" data-minutos>00</span><span class="cuenta__unidad">Minutos</span></div>
      <div class="cuenta__bloque"><span class="cuenta__numero" data-segundos>00</span><span class="cuenta__unidad">Segundos</span></div>
    </div>

    <p class="cuenta__fecha">Viernes, 30 de octubre · ESADA</p>

    <img class="cuenta__encaje" src="assets/svg/banner-encaje.svg" width="1612" height="176" alt="">
  </main>

  <script src="js/cuenta-atras.js"></script>
</body>
</html>
